openapi: 3.1.0
info:
  title: Demeter Retirement Planner API
  version: 0.1.0
  description: |
    REST API contract for Demeter Retirement Planner v1.
    Monetary values are serialized as decimal strings to preserve precision.
    Rates are decimal fractions: 5% is represented as 0.05.
servers:
  - url: https://api.example.com
    description: Production placeholder
  - url: https://staging-api.example.com
    description: Staging placeholder

tags:
  - name: Auth
  - name: Users
  - name: Retirement Plan
  - name: Calculations
  - name: Scenarios
  - name: Goals
  - name: Snapshots
  - name: Admin
  - name: Health

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a user
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          headers:
            Set-Cookie:
              description: Secure HttpOnly session/refresh cookie when cookie-based session transport is used.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Log out current session
      operationId: logout
      responses:
        '204':
          description: Logged out

  /users/me:
    get:
      tags: [Users]
      summary: Get current user profile
      operationId: getCurrentUser
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /retirement-plan:
    get:
      tags: [Retirement Plan]
      summary: Get primary retirement plan
      operationId: getRetirementPlan
      responses:
        '200':
          description: Primary plan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetirementPlan'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Retirement Plan]
      summary: Create or replace primary retirement plan assumptions
      operationId: upsertRetirementPlan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetirementPlanInput'
      responses:
        '200':
          description: Updated plan with latest calculated result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetirementPlanWithResult'
        '422':
          $ref: '#/components/responses/ValidationError'

  /calculations/latest:
    get:
      tags: [Calculations]
      summary: Get latest calculated result for primary plan
      operationId: getLatestCalculation
      responses:
        '200':
          description: Latest deterministic calculation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculationResult'
        '404':
          $ref: '#/components/responses/NotFound'

  /calculations/preview:
    post:
      tags: [Calculations]
      summary: Calculate a non-persisted deterministic preview
      operationId: previewCalculation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetirementPlanInput'
      responses:
        '200':
          description: Preview result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculationResult'
        '422':
          $ref: '#/components/responses/ValidationError'

  /scenarios:
    get:
      tags: [Scenarios]
      summary: List saved scenarios
      operationId: listScenarios
      responses:
        '200':
          description: Scenario list
          content:
            application/json:
              schema:
                type: array
                maxItems: 3
                items:
                  $ref: '#/components/schemas/Scenario'
    post:
      tags: [Scenarios]
      summary: Create saved scenario
      operationId: createScenario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScenarioInput'
      responses:
        '201':
          description: Created scenario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioWithResult'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /scenarios/{scenarioId}:
    parameters:
      - $ref: '#/components/parameters/ScenarioId'
    get:
      tags: [Scenarios]
      summary: Get scenario
      operationId: getScenario
      responses:
        '200':
          description: Scenario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioWithResult'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Scenarios]
      summary: Update scenario
      operationId: updateScenario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScenarioPatch'
      responses:
        '200':
          description: Updated scenario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioWithResult'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Scenarios]
      summary: Delete scenario
      operationId: deleteScenario
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /scenarios/compare:
    post:
      tags: [Scenarios]
      summary: Compare 2-3 scenarios without mutating the primary plan
      operationId: compareScenarios
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scenarios]
              properties:
                scenarios:
                  type: array
                  minItems: 2
                  maxItems: 3
                  items:
                    $ref: '#/components/schemas/ScenarioComparisonInput'
      responses:
        '200':
          description: Comparison output
          content:
            application/json:
              schema:
                type: array
                minItems: 2
                maxItems: 3
                items:
                  $ref: '#/components/schemas/ScenarioComparisonResult'
        '422':
          $ref: '#/components/responses/ValidationError'

  /goals:
    get:
      tags: [Goals]
      summary: Get primary retirement goal
      operationId: getPrimaryGoal
      responses:
        '200':
          description: Primary goal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetirementGoal'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Goals]
      summary: Create or update primary retirement goal
      operationId: upsertPrimaryGoal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetirementGoalInput'
      responses:
        '200':
          description: Goal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetirementGoal'

  /goals/milestones:
    post:
      tags: [Goals]
      summary: Add milestone to primary goal
      operationId: createMilestone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalMilestoneInput'
      responses:
        '201':
          description: Milestone
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalMilestone'
        '422':
          $ref: '#/components/responses/ValidationError'

  /goals/milestones/{milestoneId}:
    parameters:
      - name: milestoneId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [Goals]
      summary: Update milestone
      operationId: updateMilestone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoalMilestonePatch'
      responses:
        '200':
          description: Milestone
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoalMilestone'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Goals]
      summary: Delete milestone
      operationId: deleteMilestone
      responses:
        '204':
          description: Deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /snapshots:
    get:
      tags: [Snapshots]
      summary: List historical retirement snapshots
      operationId: listSnapshots
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 24
      responses:
        '200':
          description: Historical snapshots newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RetirementSnapshot'

  /admin/users:
    get:
      tags: [Admin]
      summary: List users
      operationId: adminListUsers
      responses:
        '200':
          description: User list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Admin]
      summary: Create user
      operationId: adminCreateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCreateUserRequest'
      responses:
        '201':
          description: Created user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '403':
          $ref: '#/components/responses/Forbidden'

  /admin/users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [Admin]
      summary: Update user status or role
      operationId: adminUpdateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUpdateUserRequest'
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /health:
    get:
      tags: [Health]
      summary: Liveness check
      operationId: health
      security: []
      responses:
        '200':
          description: Process alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /ready:
    get:
      tags: [Health]
      summary: Readiness check
      operationId: readiness
      security: []
      responses:
        '200':
          description: Service ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          description: Service not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: demeter_session

  parameters:
    ScenarioId:
      name: scenarioId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Unauthorized:
      description: Authentication required or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated but not authorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Resource conflicts with existing state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'

  schemas:
    DecimalString:
      type: string
      pattern: '^-?\d+(\.\d+)?$'
      examples: ['15000.00']

    Rate:
      type: number
      minimum: -0.99999999
      examples: [0.05]

    UserRole:
      type: string
      enum: [USER, ADMIN]

    UserStatus:
      type: string
      enum: [ACTIVE, DISABLED]

    User:
      type: object
      required: [id, email, role, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
        lastLoginAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    RegisterRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 10
          maxLength: 128

    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
          maxLength: 128

    AuthResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/User'

    ExpenseBreakdown:
      type: object
      additionalProperties: false
      properties:
        housing:
          $ref: '#/components/schemas/DecimalString'
        food:
          $ref: '#/components/schemas/DecimalString'
        healthcare:
          $ref: '#/components/schemas/DecimalString'
        travel:
          $ref: '#/components/schemas/DecimalString'
        insurance:
          $ref: '#/components/schemas/DecimalString'
        other:
          $ref: '#/components/schemas/DecimalString'

    RetirementPlanInput:
      type: object
      additionalProperties: false
      required:
        - currentAge
        - retirementAge
        - lifeExpectancy
        - currentSavings
        - monthlyContribution
        - annualContributionIncreaseRate
        - preRetirementReturnRate
        - postRetirementReturnRate
        - inflationRate
        - monthlyRetirementExpenseToday
        - currencyCode
      properties:
        currentAge:
          type: integer
          minimum: 0
          maximum: 120
        retirementAge:
          type: integer
          minimum: 1
          maximum: 120
        lifeExpectancy:
          type: integer
          minimum: 1
          maximum: 130
        currentSavings:
          $ref: '#/components/schemas/DecimalString'
        monthlyContribution:
          $ref: '#/components/schemas/DecimalString'
        annualContributionIncreaseRate:
          $ref: '#/components/schemas/Rate'
        preRetirementReturnRate:
          $ref: '#/components/schemas/Rate'
        postRetirementReturnRate:
          $ref: '#/components/schemas/Rate'
        inflationRate:
          $ref: '#/components/schemas/Rate'
        monthlyRetirementExpenseToday:
          $ref: '#/components/schemas/DecimalString'
        currencyCode:
          type: string
          pattern: '^[A-Z]{3}$'
          default: THB
        expenseBreakdown:
          $ref: '#/components/schemas/ExpenseBreakdown'

    RetirementPlan:
      allOf:
        - $ref: '#/components/schemas/RetirementPlanInput'
        - type: object
          required: [id, createdAt, updatedAt]
          properties:
            id:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    ScoreBreakdown:
      type: object
      additionalProperties: true
      description: Versioned explainable score component payload.

    ProjectionPoint:
      type: object
      required: [monthIndex, ageYears, phase, portfolioBalance]
      properties:
        monthIndex:
          type: integer
          minimum: 0
        ageYears:
          type: number
        phase:
          type: string
          enum: [ACCUMULATION, RETIREMENT]
        portfolioBalance:
          $ref: '#/components/schemas/DecimalString'
        contribution:
          $ref: '#/components/schemas/DecimalString'
        withdrawal:
          $ref: '#/components/schemas/DecimalString'
        inflationAdjustedExpense:
          $ref: '#/components/schemas/DecimalString'

    CalculationResult:
      type: object
      required:
        - id
        - calculationVersion
        - retirementFundRequired
        - projectedPortfolioAtRetirement
        - fundingGap
        - fundingSurplus
        - requiredMonthlyContribution
        - incrementalMonthlyContribution
        - readinessScore
        - readinessBreakdown
        - projectionSeries
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        calculationVersion:
          type: string
          examples: [deterministic-v1]
        retirementFundRequired:
          $ref: '#/components/schemas/DecimalString'
        projectedPortfolioAtRetirement:
          $ref: '#/components/schemas/DecimalString'
        fundingGap:
          $ref: '#/components/schemas/DecimalString'
        fundingSurplus:
          $ref: '#/components/schemas/DecimalString'
        requiredMonthlyContribution:
          $ref: '#/components/schemas/DecimalString'
        incrementalMonthlyContribution:
          $ref: '#/components/schemas/DecimalString'
        readinessScore:
          type: number
          minimum: 0
          maximum: 100
        financialHealthScore:
          type: [number, 'null']
          minimum: 0
          maximum: 100
        readinessBreakdown:
          $ref: '#/components/schemas/ScoreBreakdown'
        financialHealthBreakdown:
          oneOf:
            - $ref: '#/components/schemas/ScoreBreakdown'
            - type: 'null'
        projectionSeries:
          type: array
          items:
            $ref: '#/components/schemas/ProjectionPoint'
        depletionMonthIndex:
          type: [integer, 'null']
          minimum: 0
        createdAt:
          type: string
          format: date-time

    RetirementPlanWithResult:
      type: object
      required: [plan, result]
      properties:
        plan:
          $ref: '#/components/schemas/RetirementPlan'
        result:
          $ref: '#/components/schemas/CalculationResult'

    ScenarioOverrides:
      type: object
      additionalProperties: false
      properties:
        retirementAge:
          type: integer
          minimum: 1
          maximum: 120
        monthlyContribution:
          $ref: '#/components/schemas/DecimalString'
        expectedReturn:
          $ref: '#/components/schemas/Rate'
        monthlyRetirementExpenseToday:
          $ref: '#/components/schemas/DecimalString'

    ScenarioInput:
      type: object
      additionalProperties: false
      required: [name, overrides]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        overrides:
          $ref: '#/components/schemas/ScenarioOverrides'
        sortOrder:
          type: integer
          minimum: 0
          default: 0

    ScenarioPatch:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        overrides:
          $ref: '#/components/schemas/ScenarioOverrides'
        sortOrder:
          type: integer
          minimum: 0

    Scenario:
      allOf:
        - $ref: '#/components/schemas/ScenarioInput'
        - type: object
          required: [id, createdAt, updatedAt]
          properties:
            id:
              type: string
              format: uuid
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    ScenarioWithResult:
      type: object
      required: [scenario, result]
      properties:
        scenario:
          $ref: '#/components/schemas/Scenario'
        result:
          $ref: '#/components/schemas/CalculationResult'

    ScenarioComparisonInput:
      type: object
      required: [name, overrides]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        overrides:
          $ref: '#/components/schemas/ScenarioOverrides'

    ScenarioComparisonResult:
      type: object
      required: [name, result]
      properties:
        name:
          type: string
        result:
          $ref: '#/components/schemas/CalculationResult'

    MilestoneType:
      type: string
      enum: [SAVINGS_AMOUNT, READINESS_SCORE, FUNDING_GAP_MAX]

    GoalMilestoneInput:
      type: object
      additionalProperties: false
      required: [type, targetValue]
      properties:
        type:
          $ref: '#/components/schemas/MilestoneType'
        targetValue:
          $ref: '#/components/schemas/DecimalString'
        currencyCode:
          type: [string, 'null']
          pattern: '^[A-Z]{3}$'
        sortOrder:
          type: integer
          minimum: 0
          default: 0

    GoalMilestonePatch:
      type: object
      additionalProperties: false
      properties:
        targetValue:
          $ref: '#/components/schemas/DecimalString'
        currencyCode:
          type: [string, 'null']
          pattern: '^[A-Z]{3}$'
        sortOrder:
          type: integer
          minimum: 0

    GoalMilestone:
      allOf:
        - $ref: '#/components/schemas/GoalMilestoneInput'
        - type: object
          required: [id, achieved, createdAt, updatedAt]
          properties:
            id:
              type: string
              format: uuid
            achieved:
              type: boolean
            achievedAt:
              type: [string, 'null']
              format: date-time
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    RetirementGoalInput:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          maxLength: 40
          default: ACTIVE

    RetirementGoal:
      type: object
      required: [id, status, milestones, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
        milestones:
          type: array
          items:
            $ref: '#/components/schemas/GoalMilestone'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    RetirementSnapshot:
      type: object
      required:
        - id
        - calculationVersion
        - currentSavings
        - monthlyContribution
        - retirementFundRequired
        - projectedPortfolioAtRetirement
        - fundingGap
        - readinessScore
        - assumptions
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        calculationVersion:
          type: string
        currentSavings:
          $ref: '#/components/schemas/DecimalString'
        monthlyContribution:
          $ref: '#/components/schemas/DecimalString'
        retirementFundRequired:
          $ref: '#/components/schemas/DecimalString'
        projectedPortfolioAtRetirement:
          $ref: '#/components/schemas/DecimalString'
        fundingGap:
          $ref: '#/components/schemas/DecimalString'
        readinessScore:
          type: number
          minimum: 0
          maximum: 100
        financialHealthScore:
          type: [number, 'null']
          minimum: 0
          maximum: 100
        assumptions:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time

    AdminCreateUserRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 10
          maxLength: 128
        role:
          $ref: '#/components/schemas/UserRole'

    AdminUpdateUserRequest:
      type: object
      additionalProperties: false
      properties:
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'

    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok

    ReadinessResponse:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        checks:
          type: object
          properties:
            database:
              type: string
              enum: [ok, error]

    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string

    ValidationIssue:
      type: object
      required: [path, message]
      properties:
        path:
          type: string
        message:
          type: string

    ValidationErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          required: [issues]
          properties:
            issues:
